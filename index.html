<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Margo — la carte qui fleurit vos voyages : composez un itinéraire touristique sur-mesure autour d'un lieu de départ.">
  <meta name="theme-color" content="#10132b">
  <!-- Page d'accueil du site (https://roomsty58400.github.io/margo/) : redirige
       vers l'application. L'édition mobile séparée (margo-mobile.html) a été
       retirée : margo.html est désormais la seule édition, pour ordinateur
       comme pour mobile. Repli sans JavaScript : le meta refresh ci-dessous. -->
  <meta http-equiv="refresh" content="0; url=margo.html">
  <title>Margo</title>
  <link rel="canonical" href="margo.html">
  <script>
    // Conserve la query string et le hash éventuels (liens partagés), avec un
    // chemin relatif compatible avec le sous-dossier GitHub Pages.
    try { location.replace('margo.html' + location.search + location.hash); } catch (e) { /* le meta refresh prend le relais */ }
  </script>
</head>
<body>
  <p>Redirection vers Margo&nbsp;— si rien ne se passe, ouvrez <a href="margo.html">margo.html</a>.</p>
</body>
</html>
