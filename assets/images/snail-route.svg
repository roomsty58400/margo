<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" role="img" aria-label="Illustration : un escargot voyageur suit un chemin sinueux jalonne de fleurs, symbolisant les etapes d'un itineraire Margo">
  <defs>
    <linearGradient id="shellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe3b0"/>
      <stop offset="55%" stop-color="#fb7a3a"/>
      <stop offset="100%" stop-color="#e85d2a"/>
    </linearGradient>
  </defs>

  <!-- Trajet en pointilles -->
  <path d="M10,90 C55,98 60,50 100,58 C135,66 145,22 190,18" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="0.5 7"/>

  <!-- Etapes (fleurs) -->
    <g>
      <ellipse cx="44.92" cy="86.87" rx="4.96" ry="3.57" transform="rotate(10.0 44.92 86.87)" fill="#fff6e8"/>
      <ellipse cx="40.73" cy="90.92" rx="4.96" ry="3.57" transform="rotate(82.0 40.73 90.92)" fill="#fff6e8"/>
      <ellipse cx="35.58" cy="88.18" rx="4.96" ry="3.57" transform="rotate(154.0 35.58 88.18)" fill="#fff6e8"/>
      <ellipse cx="36.59" cy="82.44" rx="4.96" ry="3.57" transform="rotate(226.0 36.59 82.44)" fill="#fff6e8"/>
      <ellipse cx="42.37" cy="81.63" rx="4.96" ry="3.57" transform="rotate(298.0 42.37 81.63)" fill="#fff6e8"/>
      <circle cx="40.04" cy="86.01" r="2.72" fill="#f4a63c"/>
    </g>

    <g>
      <ellipse cx="87.66" cy="60.29" rx="4.34" ry="3.12" transform="rotate(35.0 87.66 60.29)" fill="#ffd166"/>
      <ellipse cx="82.84" cy="61.95" rx="4.34" ry="3.12" transform="rotate(107.0 82.84 61.95)" fill="#ffd166"/>
      <ellipse cx="79.77" cy="57.88" rx="4.34" ry="3.12" transform="rotate(179.0 79.77 57.88)" fill="#ffd166"/>
      <ellipse cx="82.70" cy="53.70" rx="4.34" ry="3.12" transform="rotate(251.0 82.70 53.70)" fill="#ffd166"/>
      <ellipse cx="87.58" cy="55.19" rx="4.34" ry="3.12" transform="rotate(323.0 87.58 55.19)" fill="#ffd166"/>
      <circle cx="84.11" cy="57.80" r="2.38" fill="#fb7a3a"/>
    </g>

    <g>
      <ellipse cx="161.90" cy="33.58" rx="5.58" ry="4.02" transform="rotate(60.0 161.90 33.58)" fill="#ff9f7a"/>
      <ellipse cx="155.38" cy="32.90" rx="5.58" ry="4.02" transform="rotate(132.0 155.38 32.90)" fill="#ff9f7a"/>
      <ellipse cx="154.02" cy="26.48" rx="5.58" ry="4.02" transform="rotate(204.0 154.02 26.48)" fill="#ff9f7a"/>
      <ellipse cx="159.70" cy="23.20" rx="5.58" ry="4.02" transform="rotate(276.0 159.70 23.20)" fill="#ff9f7a"/>
      <ellipse cx="164.57" cy="27.59" rx="5.58" ry="4.02" transform="rotate(348.0 164.57 27.59)" fill="#ff9f7a"/>
      <circle cx="159.11" cy="28.75" r="3.06" fill="#fff6e8"/>
    </g>

  <!-- Escargot voyageur -->
  <g transform="translate(133.84 48.53) rotate(-10) scale(1.05)">
    <!-- ombre portee -->
    <ellipse cx="0" cy="9.5" rx="16" ry="2.6" fill="#0d132b" opacity="0.18"/>

    <!-- corps / pied -->
    <path d="M-15,4.5 Q-17,-2 -9,-4.5 Q1,-7.5 11,-4 Q17.5,-1.6 16.5,3.4 Q15.5,7.6 7,7.6 L-9,7.6 Q-15,7.6 -15,4.5 Z"
          fill="#fff6e8" stroke="#10132b" stroke-width="1.3" stroke-linejoin="round"/>

    <!-- tete + antennes -->
    <path d="M11,-4 Q15.5,-6.5 17.5,-4.8" fill="none" stroke="#10132b" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M17,-3.4 L20.3,-10.4" fill="none" stroke="#10132b" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M13.6,-3.4 L15.2,-10.8" fill="none" stroke="#10132b" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="20.6" cy="-11.6" r="1.7" fill="#0d132b"/>
    <circle cx="15.5" cy="-11.9" r="1.7" fill="#0d132b"/>

    <!-- coquille en spirale -->
    <g transform="translate(-2 -4.5) scale(1.15)">
      <circle cx="0" cy="0" r="11.2" fill="url(#shellGrad)" stroke="#0d132b" stroke-width="0.9"/>
      <path d="M0.97,-0.26 L1.00,-0.09 L1.01,0.09 L1.00,0.27 L0.96,0.45 L0.90,0.63 L0.81,0.80 L0.68,0.96 L0.52,1.11 L0.34,1.24 L0.13,1.34 L-0.11,1.41 L-0.37,1.44 L-0.65,1.42 L-0.93,1.35 L-1.21,1.24 L-1.48,1.06 L-1.73,0.83 L-1.95,0.55 L-2.12,0.21 L-2.24,-0.17 L-2.29,-0.58 L-2.27,-1.02 L-2.16,-1.47 L-1.97,-1.91 L-1.69,-2.34 L-1.32,-2.72 L-0.87,-3.05 L-0.35,-3.30 L0.24,-3.47 L0.88,-3.53 L1.54,-3.48 L2.21,-3.30 L2.87,-2.99 L3.49,-2.56 L4.04,-1.99 L4.51,-1.32 L4.86,-0.54 L5.07,0.32 L5.14,1.24 L5.03,2.20 L4.75,3.15 L4.29,4.07 L3.65,4.93 L2.84,5.69 L1.88,6.31 L0.79,6.77 L-0.41,7.04 L-1.68,7.10 L-2.98,6.93 L-4.27,6.51 L-5.50,5.86 L-6.64,4.98 L-7.63,3.87 L-8.44,2.57 L-9.03,1.10 L-9.36,-0.49" fill="none" stroke="#fff6e8" stroke-width="1.15" stroke-linecap="round"/>
    </g>

    <!-- filet de mouvement -->
    <path d="M-24,3 Q-20,1 -17,3" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M-27,6.5 Q-23,5 -20,6.5" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.1" stroke-linecap="round"/>
  </g>
</svg>
